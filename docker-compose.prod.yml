# =====================================================================
# 生产部署编排（镜像拉取版）
#   docker compose -f docker-compose.prod.yml up -d
# 镜像由 GitHub Actions 构建并推送到 GHCR（见 .github/workflows/docker-build-push.yml），
# 服务器只需拉取镜像 + 这套编排，不需要源码/Docker 构建。
# 可用 .env 覆盖：API_IMAGE / WEB_IMAGE（镜像地址）、WEB_PORT、POSTGRES_PASSWORD。
# =====================================================================
name: evergrow

# 统一的日志轮转：json-file 驱动落盘于宿主机，最多保留 5 个 × 20MB，防磁盘膨胀。
# 说明：容器重建后 docker logs 只查当前容器；需长期留档请用下面的 journald / 日志采集方案。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  api:
    image: ${API_IMAGE:-ghcr.io/aaronlou/photo.evergrow.club.ts/api:latest}
    restart: unless-stopped
    logging: *default-logging
    environment:
      PORT: "3000"
      # 容器内时区（自然语言时间解析「本周日14点」按此理解，UTC 会偏 8 小时）
      TZ: Asia/Shanghai
      DATABASE_URL: postgres://evergrow:${POSTGRES_PASSWORD:-evergrow}@postgres:5432/evergrow
      REDIS_URL: redis://redis:6379
      # 管理端令牌（/admin/* 接口校验 x-admin-token；留空则管理端禁用）
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # LLM 接入（可选；不配则 AI 功能回落到规则解析模式）
      # 密钥只来自这里（环境变量），绝不写入数据库
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    volumes:
      # 上传样片持久化（ImageStorageLocal 写入 /app/uploads）
      - evergrow_uploads:/app/uploads

  web:
    image: ${WEB_IMAGE:-ghcr.io/aaronlou/photo.evergrow.club.ts/web:latest}
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: evergrow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evergrow}
      POSTGRES_DB: evergrow
    volumes:
      - evergrow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evergrow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  evergrow_pgdata:
  evergrow_uploads:
