# 生产部署编排：一条命令拉起全部服务
#   docker compose -f docker-compose.prod.yml up -d --build
# 访问 http://<服务器>:8080（WEB_PORT 可改），API 文档在 /docs
name: evergrow

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://evergrow:${POSTGRES_PASSWORD:-evergrow}@postgres:5432/evergrow
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evergrow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evergrow}
      POSTGRES_DB: evergrow
    volumes:
      - evergrow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evergrow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  evergrow_pgdata:
