services:
  postgres:
    image: postgres:17-alpine
    container_name: evergrow-postgres
    environment:
      POSTGRES_USER: evergrow
      POSTGRES_PASSWORD: evergrow
      POSTGRES_DB: evergrow
    ports:
      - "5432:5432"
    volumes:
      - evergrow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evergrow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: evergrow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: evergrow-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - evergrow_minio:/data

volumes:
  evergrow_pgdata:
  evergrow_minio:
